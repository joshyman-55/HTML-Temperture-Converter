<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#e0e0e0">
    <title>Temperature Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="temp_style.css">
</head>
<body>
    <div id="appContainer" class="vbox">
        <div class="decimal-row">
            <label id="decimalPrompt" for="decimalSelect">Decimal Places:</label>
            <select id="decimalSelect">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>

        <label id="prompt">Enter Temperature:</label>
        <div class="unit-input-wrap">
            <input type="text" id="inputField" autocomplete="off">
            <span id="fromAbbr" class="unit-abbr"></span>
        </div>
        <select id="fromUnit">
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Celsius">Celsius</option>
            <option value="Kelvin">Kelvin</option>
            <option value="Rankine">Rankine</option>
        </select>

        <label id="resultPrompt">Result:</label>
        <div class="unit-input-wrap">
            <input type="text" id="outputField" readonly>
            <span id="toAbbr" class="unit-abbr"></span>
        </div>
        <select id="toUnit">
            <option value="Fahrenheit">Fahrenheit</option>
            <option value="Celsius" selected>Celsius</option>
            <option value="Kelvin">Kelvin</option>
            <option value="Rankine">Rankine</option>
        </select>

        <button id="convertBtn">Convert</button>

        <div id="resultLabel"></div>
    </div>
    <script src="temp_script.js"></script>
</body>
</html>
